<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helm — project management portal</title>
<meta name="description" content="A coached project management portal: Sprint or Kanban mode per project, live delivery metrics, and one-click status reports. English / Tiếng Việt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8F5; --card:#FFFFFF; --ink:#1B2421; --muted:#5E6862; --line:#E3E7E0; --line2:#EDF0EA;
  --sprint:#4A43B5; --sprint-soft:#EEEDFB; --sprint-deep:#332E82;
  --flow:#0B7A66; --flow-soft:#E2F3ED; --flow-deep:#0A5145;
  --amber:#98620A; --amber-soft:#FAF0DB; --red:#B4432A; --red-soft:#FAEAE5;
  --accent:#1B2421; --accent-soft:#EEF0EC; --accent-deep:#1B2421;
  --disp:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px; --rlg:16px;
  --sh1:0 1px 2px rgba(27,36,33,.05), 0 1px 1px rgba(27,36,33,.03);
  --sh2:0 10px 28px -10px rgba(27,36,33,.16), 0 2px 6px -2px rgba(27,36,33,.08);
  --sh3:0 24px 60px -16px rgba(27,36,33,.25);
}
body[data-mode="scrum"]{--accent:var(--sprint);--accent-soft:var(--sprint-soft);--accent-deep:var(--sprint-deep)}
body[data-mode="kanban"]{--accent:var(--flow);--accent-soft:var(--flow-soft);--accent-deep:var(--flow-deep)}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:var(--accent-soft)}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
body{background-image:radial-gradient(1200px 400px at 70% -10%, rgba(74,67,181,.05), transparent 60%),radial-gradient(1000px 380px at 10% -10%, rgba(11,122,102,.05), transparent 60%)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.01em}
h2{font-size:clamp(23px,3vw,31px);font-weight:600}
h3{font-size:17.5px;font-weight:600}
@media (prefers-reduced-motion: no-preference){
  button,.task,.pcard,.card,input,select,textarea,.stat,.col,.tabs button{transition:box-shadow .16s ease,transform .16s ease,border-color .16s ease,background-color .16s ease,color .16s ease,opacity .16s ease}
}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(247,248,245,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:11px 0;flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:14px;display:flex;align-items:center;gap:10px;border:0;background:none}
.brand .mark{display:inline-block;width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--sprint) 49.5%,var(--flow) 50.5%);box-shadow:var(--sh1)}
.brand:hover{opacity:.75}
.bar .grow{flex:1}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:2px;gap:2px;box-shadow:var(--sh1)}
.lang button{font-family:var(--mono);font-size:11.5px;border:0;background:none;color:var(--muted);padding:4px 10px;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.coach-switch{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.switch{position:relative;width:40px;height:22px;background:#CBD1C9;border-radius:999px;border:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh1);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
@media (prefers-reduced-motion: reduce){.switch::after{transition:none}}

/* ---------- generic ---------- */
main{padding:30px 0 80px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:22px;box-shadow:var(--sh1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.btn{font-family:var(--mono);font-size:13px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 17px;border-radius:999px;box-shadow:var(--sh1)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.btn:active{transform:translateY(0);box-shadow:var(--sh1)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--card);color:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 12px;font-size:12px;box-shadow:none}
.mut{color:var(--muted)} .small{font-size:13.5px} .mono{font-family:var(--mono)}
.spacer{height:20px}
input[type="text"],input[type="number"],textarea,select{font:inherit;font-size:14.5px;color:var(--ink);background:#FCFDFB;border:1px solid var(--line);border-radius:9px;padding:8px 12px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:74px;resize:vertical}
label.f{display:block;margin-bottom:13px}
label.f .lb{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- coach hints ---------- */
.hint{display:flex;gap:10px;background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid color-mix(in srgb,var(--accent) 14%, transparent);border-radius:10px;padding:10px 13px;margin-top:9px;font-size:13.5px;color:var(--accent-deep);line-height:1.55}
.hint::before{content:"✳";flex:none;width:19px;height:19px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:2px}
body.coach-off .hint{display:none}

/* ---------- segmented ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:3px;gap:3px;box-shadow:var(--sh1)}
.seg button{font-family:var(--mono);font-size:12.5px;border:0;background:none;color:var(--muted);padding:6px 15px;border-radius:999px}
.seg button[aria-pressed="true"]{color:#fff;box-shadow:var(--sh1)}
.seg button[data-m="scrum"][aria-pressed="true"]{background:var(--sprint)}
.seg button[data-m="kanban"][aria-pressed="true"]{background:var(--flow)}

/* ---------- project header & tabs ---------- */
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pill{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 11px;background:var(--accent-soft);color:var(--accent-deep)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-family:var(--mono);font-size:13px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:9px 14px;white-space:nowrap;border-radius:8px 8px 0 0}
.tabs button:hover{background:var(--line2);color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent-deep);border-bottom-color:var(--accent)}

/* ---------- home ---------- */
.pcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:18px 20px;box-shadow:var(--sh1)}
.pcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--sh2)}
.pcard .nm{font-family:var(--disp);font-weight:600;font-size:19px}
.pcard .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:5px;display:block}
.pcard .modep{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:2px}
.pcard .modep.scrum{background:var(--sprint-soft);color:var(--sprint-deep)}
.pcard .modep.kanban{background:var(--flow-soft);color:var(--flow-deep)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.col{background:linear-gradient(180deg,#F2F4EF, #F0F2ED);border:1px solid var(--line);border-radius:var(--rlg);padding:10px;min-height:130px}
.col.over{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.col.breach{background:var(--red-soft);border-color:#E4B4A7}
.col h4{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:3px 4px 9px;display:flex;justify-content:space-between;align-items:center}
.col h4 .cnt{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px}
.col.breach h4 .cnt{color:#fff;background:var(--red);border-color:var(--red);font-weight:500}
.task{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:var(--sh1)}
.task:hover{transform:translateY(-1px);box-shadow:var(--sh2);border-color:var(--accent);border-left-color:var(--accent)}
.task.dragging{opacity:.45}
.task .tt{font-size:14px;font-weight:600;line-height:1.35}
.task .tm{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
.task .tm .dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.story{background:var(--flow)} .dot.bug{background:var(--red)} .dot.chore{background:#8A93A5}
.task .pts{background:var(--accent-soft);color:var(--accent-deep);border-radius:6px;padding:0 7px}
.task .blocked{background:var(--red-soft);color:var(--red);border-radius:6px;padding:0 7px}
.task .added{background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:0 7px}
.task .mv{display:flex;gap:4px;margin-left:auto}
.task .mv button{border:1px solid var(--line);background:var(--card);border-radius:7px;font-family:var(--mono);font-size:12px;padding:1px 9px;color:var(--muted)}
.task .mv button:hover{color:var(--ink);border-color:var(--ink);transform:translateY(-1px)}
.addform{display:flex;gap:6px;margin-top:2px}
.addform input{font-size:13.5px;padding:6px 10px;background:var(--card)}
.empty{border:1.5px dashed var(--line);border-radius:var(--rlg);padding:34px 26px;text-align:center;color:var(--muted);font-size:14.5px;background:var(--card)}

/* ---------- backlog & sprints ---------- */
.bl-item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 13px;margin-bottom:8px;flex-wrap:wrap;box-shadow:var(--sh1)}
.bl-item:hover{border-color:var(--accent)}
.bl-item .tt{font-size:14px;font-weight:600;flex:1;min-width:140px;background:none;border:0;text-align:left;font-family:inherit;cursor:pointer;padding:0}
.bl-item select{width:auto;font-size:12.5px;padding:4px 9px}
.sprint-card{border:1px solid var(--line);border-left:4px solid var(--sprint);border-radius:var(--rlg);background:var(--card);padding:17px;margin-bottom:12px;box-shadow:var(--sh1)}
.sprint-card.active{border-left-color:var(--flow)}
.sprint-card h4{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.sprint-card .g{font-size:14px;color:var(--muted);margin:4px 0 8px}
.progress{height:8px;background:var(--line2);border-radius:99px;overflow:hidden;margin:9px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%, #fff));border-radius:99px}

/* ---------- metrics ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:16px 18px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent 70%)}
.stat .v{font-family:var(--disp);font-weight:700;font-size:31px;line-height:1.15;color:var(--accent-deep)}
.stat .l{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .sub{font-size:13px;color:var(--muted);margin-top:3px}
.stat.warn .v{color:var(--red)} .stat.warn::before{background:linear-gradient(90deg,var(--red),transparent 70%)}
svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
svg .axis{stroke:#CBD1C9;stroke-width:1}
.chartcard{background:var(--card);border:1px solid var(--line);border-radius:var(--rlg);padding:18px;margin-top:16px;box-shadow:var(--sh1)}
.aging{list-style:none}
.aging li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.aging li:last-child{border:0}
.aging .old{color:var(--red);font-family:var(--mono);font-size:12.5px}

/* ---------- reports ---------- */
#reportOut{font-family:var(--mono);font-size:13px;min-height:340px;white-space:pre;line-height:1.65}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;display:none;z-index:60}
#modal.open{display:block}
#modal .scrim{position:absolute;inset:0;background:rgba(27,36,33,.42);backdrop-filter:blur(2px)}
#modal .box{position:relative;max-width:560px;margin:6vh auto;background:var(--card);border-radius:18px;padding:26px;max-height:86vh;overflow:auto;box-shadow:var(--sh3)}
@media (prefers-reduced-motion: no-preference){
  #modal.open .box{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(10px) scale(.985);opacity:0}to{transform:none;opacity:1}}
}
#modal .box h3{margin-bottom:14px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(6px);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:13px;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;box-shadow:var(--sh2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{border-top:1px solid var(--line);padding:22px 0 46px;color:var(--muted);font-size:12.5px;font-family:var(--mono)}
@media(max-width:900px){.board{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.board,.grid2,.grid3{grid-template-columns:1fr}.bar{gap:10px}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <button class="brand" data-action="nav-home"><span class="mark"></span> helm</button>
    <div class="grow"></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-action="set-lang" data-lang="en" aria-pressed="true">EN</button>
      <button data-action="set-lang" data-lang="vi" aria-pressed="false">VI</button>
    </div>
    <div class="coach-switch"><span id="coachLabel">coach hints</span>
      <button class="switch" id="coachSwitch" role="switch" aria-checked="true" aria-label="Toggle coach hints" data-action="toggle-coach"></button>
    </div>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<div id="modal"><div class="scrim" data-action="close-modal"></div><div class="box" id="modalBox"></div></div>
<div id="toast" role="status"></div>
<footer><div class="wrap" id="footTxt"></div></footer>
<script>
/* ================= i18n ================= */
const I18N = {
en: {
  coach:'coach hints', foot:'helm · single-file portal · data lives in this browser (localStorage) — export regularly · cloud sync via Supabase: see plan', title:'Helm — project management portal',

  h_home:'Step 1 of everything: a project is a container with a <b>delivery mode</b>. Pick <b>Sprint</b> when stakeholders need date commitments and a demo cadence; pick <b>Kanban</b> when priorities churn and work should flow continuously. You can switch later — history is kept.',
  createProject:'Create a project', pname:'Project name', pnamePh:'e.g. Onboarding revamp',

  h_modeSwitch:'Mode changes the operating system, not the data: <b>Sprint</b> shows only the active sprint on the board and unlocks velocity, burndown and say/do. <b>Kanban</b> shows continuous flow with WIP limits and unlocks cycle time, throughput and the CFD. Running sprints <i>with</i> WIP limits is Scrumban — a legitimate hybrid.',

  spDayMeta:'{0}/{1} pts · day {2}/{3}', spChurn:' · +{0} pts added after start',

const DAY = 86400000;
let S = load() || { projects: [], activeProjectId: null, tab: 'board', coach: true, lang: 'en' };
if (!S.lang) S.lang = 'en';
function load(){ try{ return JSON.parse(localStorage.getItem(LS)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = ts => new Date(ts).toLocaleDateString(S.lang === 'vi' ? 'vi-VN' : undefined, {month:'short', day:'numeric'});
const daysAgo = ts => Math.max(0, Math.round((Date.now() - ts) / DAY));
const endOfDay = ts => { const d = new Date(ts); d.setHours(23,59,59,999); return d.getTime(); };

const STATUSES = ['backlog','todo','doing','review','done'];
const L = st => t('st_' + st);

const activeSprint = p => p.sprints.find(s => s.state === 'active');
const plannedSprints = p => p.sprints.filter(s => s.state === 'planned');
const closedSprints = p => p.sprints.filter(s => s.state === 'closed');
const taskById = (p, id) => p.tasks.find(t => t.id === id);
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast._h); toast._h = setTimeout(() => el.classList.remove('show'), 2200); }

/* ================= domain actions ================= */
function createProject({name, mode, sprintLen, wipDoing, wipReview}){
  const key = name.replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase() || 'PRJ';
  const p = { id: uid(), name, key, mode, createdAt: Date.now(), seq: 0,
    settings: { sprintLen: sprintLen || 14, wipDoing: wipDoing || 4, wipReview: wipReview || 2 },
    sprints: [], tasks: [] };
  S.projects.push(p); S.activeProjectId = p.id; S.tab = p.mode === 'scrum' ? 'backlog' : 'board';
  return p;
}
function createTask(p, {title, type='story', points=3, status='backlog', desc='', priority='medium', sprintId=null}){
  p.seq++;
  const task = { id: uid(), key: p.key + '-' + p.seq, title, desc, type, priority, points: +points || 0,
    status, sprintId, blocked: false, addedAfterStart: false,
    createdAt: Date.now(), startedAt: null, doneAt: null,
    history: [{ ts: Date.now(), from: null, to: status }] };
  const as = activeSprint(p);
  if (sprintId && as && sprintId === as.id) task.addedAfterStart = true;
  p.tasks.push(task); return task;
}
function setStatus(p, task, to){
  if (task.status === to || !STATUSES.includes(to)) return;
  const from = task.status; task.status = to;
  task.history.push({ ts: Date.now(), from, to });
  if (to === 'doing' && !task.startedAt) task.startedAt = Date.now();
  if (to === 'done') task.doneAt = Date.now();
  if (from === 'done' && to !== 'done') task.doneAt = null;
}
function moveTask(p, task, dir){
  const order = ['todo','doing','review','done'];
  let i = order.indexOf(task.status);
  if (i === -1) { setStatus(p, task, 'todo'); return; }
  const ni = i + dir;
  if (ni < 0 || ni >= order.length) return;
  setStatus(p, task, order[ni]);
}
function createSprint(p){
  const n = p.sprints.length + 1;
  p.sprints.push({ id: uid(), number: n, goal: '', state: 'planned',
    startAt: null, endAt: null, committedIds: [], committedPoints: 0, summary: null });
}
function startSprint(p, sp){
  if (activeSprint(p)) { toast(t('t_closeFirst')); return; }
  const members = p.tasks.filter(x => x.sprintId === sp.id);
  if (!members.length) { toast(t('t_assignFirst')); return; }
  sp.state = 'active'; sp.startAt = Date.now();
  sp.endAt = Date.now() + p.settings.sprintLen * DAY;
  sp.committedIds = members.map(x => x.id);
  sp.committedPoints = members.reduce((a,x) => a + x.points, 0);
  members.forEach(x => { if (x.status === 'backlog') setStatus(p, x, 'todo'); });
}
function closeSprint(p, sp){
  const members = p.tasks.filter(x => x.sprintId === sp.id);
  const delivered = members.filter(x => x.status === 'done').reduce((a,x) => a + x.points, 0);
  const added = members.filter(x => x.addedAfterStart).reduce((a,x) => a + x.points, 0);
  const goalMet = confirm(tf('c_close', sp.number));
  sp.summary = { committedPoints: sp.committedPoints, deliveredPoints: delivered, addedPoints: added, goalMet, closedAt: Date.now() };
  sp.state = 'closed';
  members.forEach(x => {
    if (x.status !== 'done') { setStatus(p, x, 'backlog'); x.sprintId = null; x.addedAfterStart = false; }
  });
}

/* ================= metrics ================= */
const pct = (arr, q) => { if(!arr.length) return null; const a=[...arr].sort((x,y)=>x-y); return a[Math.min(a.length-1, Math.ceil(q*a.length)-1)]; };
function cycleDays(x){ return (x.doneAt && x.startedAt) ? Math.max(0.2,(x.doneAt - x.startedAt)/DAY) : null; }
function kanbanMetrics(p){
  const done = p.tasks.filter(x => x.status === 'done');
  const cycles = done.map(cycleDays).filter(v => v !== null);
  const wip = p.tasks.filter(x => x.status === 'doing' || x.status === 'review');
  const weeks = [];
  for (let w = 5; w >= 0; w--){
    const end = endOfDay(Date.now() - w*7*DAY), start = end - 7*DAY;
    weeks.push({ label: w === 0 ? t('wkThis') : '-' + w + 'w', v: done.filter(x => x.doneAt > start && x.doneAt <= end).length });
  }
  const aging = p.tasks.filter(x => x.startedAt && !x.doneAt && x.status !== 'backlog')
    .map(x => ({ t: x, age: (Date.now() - x.startedAt)/DAY })).sort((a,b) => b.age - a.age);
  return { cycles, p85: pct(cycles,.85), p50: pct(cycles,.5), weeks,
    tpAvg: weeks.reduce((a,w)=>a+w.v,0)/6, wipNow: wip.length,
    aging, blocked: p.tasks.filter(x => x.blocked && x.status !== 'done') };
}
function cfdSeries(p, days=28){
  const out = [];
  for (let d = days-1; d >= 0; d--){
    const ts = endOfDay(Date.now() - d*DAY);
    const c = { queued:0, doing:0, review:0, done:0 };
    p.tasks.forEach(x => {
      if (x.createdAt > ts) return;
      let st = 'backlog';
      for (const h of x.history){ if (h.ts <= ts) st = h.to; else break; }
      if (st === 'backlog' || st === 'todo') c.queued++;
      else c[st]++;
    });
    out.push(c);
  }
  return out;
}
function burndown(p, sp){
  const members = p.tasks.filter(x => x.sprintId === sp.id);
  const total = members.reduce((a,x) => a + x.points, 0);
  const nDays = Math.max(1, Math.round((sp.endAt - sp.startAt)/DAY));
  const ideal = [], actual = [];
  for (let d = 0; d <= nDays; d++){
    const ts = endOfDay(sp.startAt + d*DAY);
    ideal.push(total * (1 - d/nDays));
    if (ts <= endOfDay(Date.now()) || d === 0){
      const donePts = members.filter(x => x.doneAt && x.doneAt <= ts).reduce((a,x) => a + x.points, 0);
      actual.push(total - donePts);
    }
  }
  return { total, nDays, ideal, actual,
    scopeAdded: Math.max(0, total - sp.committedPoints),
    donePts: members.filter(x => x.status==='done').reduce((a,x)=>a+x.points,0),
    dayNow: Math.min(nDays, Math.max(0, Math.round((Date.now()-sp.startAt)/DAY))) };
}
function velocitySeries(p){
  return closedSprints(p).map(sp => ({ n: sp.number, delivered: sp.summary.deliveredPoints, committed: sp.summary.committedPoints, goalMet: sp.summary.goalMet }));
}

/* ================= tiny SVG charts ================= */
function svgBars(items, {color='var(--accent)', w=560, h=190, ghost=false} = {}){
  if(!items.length) return '';
  const max = Math.max(1, ...items.map(i => Math.max(i.v, i.g||0)));
  const bw = Math.min(56, (w-60)/items.length - 14);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%">`;
  s += `<line x1="42" y1="${h-30}" x2="${w-8}" y2="${h-30}" class="axis"/>`;
  items.forEach((it,i) => {
    const x = 52 + i * ((w-60)/items.length);
    const bh = (it.v/max)*(h-70), y = h-30-bh;
    if (ghost && it.g != null){
      const gh = (it.g/max)*(h-70);
      s += `<rect x="${x}" y="${h-30-gh}" width="${bw}" height="${gh}" fill="none" stroke="#C9CFC7" stroke-dasharray="3 3" rx="4"/>`;
    }
    s += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,bh)}" fill="${color}" rx="4"/>`;
    s += `<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" fill="#1B2421">${it.v}</text>`;
    s += `<text x="${x+bw/2}" y="${h-12}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return s + '</svg>';
}
function svgBurndown(bd, w=560, h=210){
  const max = Math.max(1, bd.total);
  const x = d => 46 + d*(w-66)/bd.nDays;
  const y = v => (h-36) - (v/max)*(h-66);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%">`;
  s += `<line x1="46" y1="14" x2="46" y2="${h-36}" class="axis"/><line x1="46" y1="${h-36}" x2="${w-14}" y2="${h-36}" class="axis"/>`;
  s += `<text x="46" y="10">${t('ch_rem')}</text><text x="${w-14}" y="${h-18}" text-anchor="end">${tf('ch_day', bd.nDays)}</text>`;
  s += `<polyline fill="none" stroke="#AEB6AC" stroke-width="1.2" stroke-dasharray="5 5" points="${bd.ideal.map((v,d)=>x(d)+','+y(v)).join(' ')}"/>`;
  s += `<polyline fill="none" stroke="var(--sprint)" stroke-width="2.2" stroke-linejoin="round" points="${bd.actual.map((v,d)=>x(d)+','+y(v)).join(' ')}"/>`;
  bd.actual.forEach((v,d)=>{ s += `<circle cx="${x(d)}" cy="${y(v)}" r="3" fill="var(--sprint)"/>`; });
  return s + '</svg>';
}
function svgCFD(series, w=560, h=220){
  const n = series.length;
  const max = Math.max(1, ...series.map(c => c.queued + c.doing + c.review + c.done));
  const x = i => 46 + i*(w-60)/(n-1);
  const y = v => (h-34) - (v/max)*(h-58);
  const layers = [
    { k:'done',   fill:'#0B7A66', op:.5 },
    { k:'review', fill:'#EF9F27', op:.5 },
    { k:'doing',  fill:'#4A43B5', op:.45 },
    { k:'queued', fill:'#B4B2A9', op:.35 },
  ];
  let cum = series.map(() => 0), s = `<svg viewBox="0 0 ${w} ${h}" width="100%">`;
  layers.forEach(Lr => {
    const lower = [...cum];
    cum = cum.map((v,i) => v + series[i][Lr.k]);
    const top = cum.map((v,i) => x(i)+','+y(v)).join(' ');
    const bot = lower.map((v,i) => x(i)+','+y(v)).reverse().join(' ');
    s += `<polygon points="${top} ${bot}" fill="${Lr.fill}" opacity="${Lr.op}"/>`;
  });
  s += `<line x1="46" y1="14" x2="46" y2="${h-34}" class="axis"/><line x1="46" y1="${h-34}" x2="${w-14}" y2="${h-34}" class="axis"/>`;
  s += `<text x="46" y="10">${t('ch_items')}</text><text x="${w-14}" y="${h-16}" text-anchor="end">${t('ch_today')}</text><text x="46" y="${h-16}">-${n-1}${t('d')}</text>`;
  s += `<text x="${w-14}" y="${h-46}" text-anchor="end" fill="#0A5145">${t('ch_doneLegend')}</text>`;
  return s + '</svg>';
}

function viewBoard(p){
  const as = activeSprint(p);

  if (p.mode === 'scrum'){
    if (!as) return `<div class="empty">${t('noSprint')}<br><br>

    pool = p.tasks.filter(x => x.sprintId === as.id);
  } else {
    pool = p.tasks.filter(x => x.status !== 'backlog');
  }
  const cols = ['todo','doing','review','done'].map(st => {
    const items = pool.filter(x => x.status === st);
    const lim = st === 'doing' ? p.settings.wipDoing : st === 'review' ? p.settings.wipReview : null;
    const kanbanLimit = p.mode === 'kanban' && lim;
    const breach = kanbanLimit && items.length > lim;
    return `
    <div class="col ${breach?'breach':''}" data-drop="${st}">
      <h4><span>${L(st)}</span><span class="cnt">${items.length}${kanbanLimit ? ' / ' + lim : ''}</span></h4>
      ${items.map(x => taskCard(p,x)).join('')}
      ${st === 'todo' && p.mode === 'kanban' ? `
        <form class="addform" data-form="quick-task"><input type="text" name="title" placeholder="${esc(t('newCard'))}" aria-label="New card title"><button class="btn sm accent" type="submit">${t('add')}</button></form>` : ''}
    </div>`;
  }).join('');
  const sprintBar = as ? (() => { const bd = burndown(p, as); return `
    <div class="sprint-card active" style="margin-bottom:14px">
      <div class="row" style="justify-content:space-between">
        <h4>${tf('sprintBar', as.number, bd.dayNow, bd.nDays)}</h4>
        <span class="mono small">${tf('ptsDone', bd.donePts, bd.total)}${bd.scopeAdded ? ' · ' + tf('plusAdded', bd.scopeAdded) : ''}</span>
      </div>
      ${as.goal ? `<p class="g">${t('goal')}: ${esc(as.goal)}</p>` : ''}
      <div class="progress"><i style="width:${bd.total? Math.round(100*bd.donePts/bd.total):0}%"></i></div>
    </div>`; })() : '';

/* ---------- reports ---------- */
function buildReport(p){
  const d = new Date().toISOString().slice(0,10);
  const done7 = p.tasks.filter(x => x.doneAt && Date.now() - x.doneAt < 7*DAY);
  const blocked = p.tasks.filter(x => x.blocked && x.status !== 'done');
  const fd = v => v === null ? t('na') : (Math.round(v*10)/10) + t('d');
  let out = `# ${t('r_title')} — ${p.name}\n${t('r_date')}: ${d} · ${t('r_mode')}: ${p.mode === 'scrum' ? t('r_modeS') : t('r_modeK')}\n\n`;
  if (p.mode === 'scrum'){
    const as = activeSprint(p), vel = velocitySeries(p);
    if (as){
      const bd = burndown(p, as);
      const expected = bd.total * (1 - bd.dayNow/bd.nDays);
      const remaining = bd.actual[bd.actual.length-1];
      out += `## ${t('r_curSprint')} (S${as.number}, ${tf('ch_day', bd.dayNow + '/' + bd.nDays)})\n`;
      if (as.goal) out += `${t('r_goal')}: ${as.goal}\n`;
      out += tf('r_progress', bd.donePts, bd.total, remaining, Math.round(expected), remaining <= expected + 2 ? t('r_onTrack') : t('r_atRisk')) + '\n';
      if (bd.scopeAdded) out += tf('r_churn', bd.scopeAdded) + '\n';
      out += '\n';
    } else out += `## ${t('r_curSprint')}\n${t('r_noSprint')}\n\n`;
    if (vel.length){
      const last = vel[vel.length-1];
      out += `## ${t('r_trend')}\n` + tf('r_avgVel', Math.round(vel.reduce((a,v)=>a+v.delivered,0)/vel.length), vel.length) + '\n';
      out += tf('r_sayDo', Math.round(100*last.delivered/Math.max(1,last.committed)), last.delivered, last.committed, last.goalMet?t('r_met'):t('r_missed')) + '\n\n';
    }
  } else {
    const m = kanbanMetrics(p);
    out += `## ${t('r_flow')}\n` + tf('r_tp', m.weeks[5].v, Math.round(m.tpAvg*10)/10) + '\n';
    out += tf('r_ct', fd(m.p85), fd(m.p50)) + '\n';
    out += tf('r_wip', m.wipNow, p.settings.wipDoing, p.settings.wipReview) + '\n';
    const over = m.aging.filter(a => m.p85 && a.age > m.p85);
    if (over.length) out += tf('r_aging', over.map(a => a.t.key).join(', ')) + '\n';
    out += '\n';
  }
  out += `## ${tf('r_shipped', done7.length)}\n${done7.map(x => `- ${x.key} ${x.title}`).join('\n') || t('r_nothing')}\n\n`;
  out += `## ${tf('r_risks', blocked.length)}\n${blocked.map(x => `- ${x.key} ${x.title} — ${t('r_blocked')}`).join('\n') || t('r_none')}\n`;
  return out;
}

/* ================= demo data ================= */
function seedDemo(){
  const now = Date.now();
  const rnd = (a,b) => a + Math.random()*(b-a);
  const vi = S.lang === 'vi';
  const k = createProject({name: vi ? 'Luồng hỗ trợ — thẻ' : 'Support stream — cards', mode:'kanban', wipDoing:4, wipReview:2});
  const titles = ['OTP retry limit for card activation','3DS challenge fails on older devices','Refund status copy unclear','Push notification dedupe','Card freeze toggle lags','Statement PDF locale bug','Limit change form validation','Failed top-up retry loop','FAQ deep links broken','ATM locator radius wrong','Chat handoff loses context','KYC photo upload timeout','Reissue flow date picker','Apple Pay provisioning error','Cashback rounding mismatch','Login rate limiter too strict','Transaction search accents','PIN change happy-path polish','Standing order edit crash','Onboarding progress bar stuck','Marketing consent copy','Currency FX tooltip','Widget balance stale','Dark mode contrast pass','Card art preview cache','Push token refresh'];
  titles.forEach((title, i) => {
    const created = now - rnd(3,30)*DAY;
    const type = i % 3 === 0 ? 'bug' : (i % 5 === 0 ? 'chore' : 'story');
    const x = createTask(k, {title, type, points: [1,2,3,5][i%4], status:'backlog'});
    x.createdAt = created; x.history = [{ts:created, from:null, to:'backlog'}];
    const r = Math.random();
    if (r < .82){
      const pulled = created + rnd(.2,3)*DAY;
      x.history.push({ts:pulled, from:'backlog', to:'todo'}); x.status='todo';
      if (r < .72){
        const started = pulled + rnd(.2,2)*DAY;
        x.startedAt = started; x.history.push({ts:started, from:'todo', to:'doing'}); x.status='doing';
        if (r < .5){
          const rev = started + rnd(.5,4)*DAY;
          const done = Math.min(now - rnd(0,.5)*DAY, rev + rnd(.3,3)*DAY);
          x.history.push({ts:rev, from:'doing', to:'review'});
          x.history.push({ts:done, from:'review', to:'done'});
          x.status='done'; x.doneAt = done;
        } else if (r < .62){
          x.history.push({ts:started + rnd(.5,3)*DAY, from:'doing', to:'review'}); x.status='review';
        }
      }
    }
  });
  k.tasks[10].blocked = true; k.tasks[16].blocked = true;
  const s = createProject({name: vi ? 'Cải tổ onboarding' : 'Onboarding revamp', mode:'scrum', sprintLen:14});
  const mk = (title, pts, sprintId, doneAtTs, status='done') => {
    const x = createTask(s, {title, points:pts, status:'backlog', sprintId});
    const created = (doneAtTs || now) - rnd(6,16)*DAY;
    x.createdAt = created; x.history = [{ts:created, from:null, to:'backlog'}];
    if (status !== 'backlog'){
      const start = (doneAtTs || now) - rnd(2,6)*DAY;
      x.startedAt = start;
      x.history.push({ts:start - rnd(.5,2)*DAY, from:'backlog', to:'todo'});
      x.history.push({ts:start, from:'todo', to:'doing'});
      x.status = 'doing';
      if (status === 'review' || status === 'done') { x.history.push({ts:start + rnd(.5,2)*DAY, from:'doing', to:'review'}); x.status='review'; }
      if (status === 'done'){ x.history.push({ts:doneAtTs, from:'review', to:'done'}); x.status='done'; x.doneAt = doneAtTs; }
    }
    return x;
  };
  const parts = ['welcome screen','doc scan flow','address autofill','progress indicator','error states','analytics events','copy pass'];
  [[1, now-35*DAY, now-21*DAY, 24, 21, true, 0], [2, now-21*DAY, now-7*DAY, 26, 19, false, 5]].forEach(([n, st, en, com, del, goal, add]) => {
    const sp = { id: uid(), number:n, goal: n===1?'Ship the new welcome flow skeleton':'KYC step reduced to two screens', state:'closed', startAt:st, endAt:en, committedIds:[], committedPoints:com, summary:{committedPoints:com, deliveredPoints:del, addedPoints:add, goalMet:goal, closedAt:en} };
    s.sprints.push(sp);
    let left = del;
    while (left > 0){ const pts = Math.min(left, [3,5,8][Math.floor(rnd(0,3))]); mk('S'+n+' — '+parts[Math.floor(rnd(0,7))], pts, sp.id, st + rnd(.25,.95)*(en-st)); left -= pts; }
  });
  const as = { id: uid(), number:3, goal: vi ? 'Giảm tỉ lệ rớt ở bước xác minh số điện thoại' : 'Cut onboarding drop-off on the phone-verify step', state:'active', startAt: now-6*DAY, endAt: now+8*DAY, committedIds:[], committedPoints:0, summary:null };
  s.sprints.push(as);
  const a1 = mk('Resend-code cooldown UX', 5, as.id, now-4*DAY, 'done');
  const a2 = mk('Fallback to voice call', 5, as.id, now-1.5*DAY, 'done');
  const a3 = mk('Error copy for wrong number', 3, as.id, null, 'review');
  const a4 = mk('Prefill number from SIM', 5, as.id, null, 'doing'); a4.blocked = true;
  const a5 = mk('Analytics for verify funnel', 3, as.id, null, 'doing');
  const a6 = mk('A/B test scaffolding', 2, as.id, null, 'backlog'); setStatus(s, a6, 'todo');
  const a7 = mk('Hotfix: crash on paste', 2, as.id, null, 'doing'); a7.addedAfterStart = true;
  as.committedIds = [a1,a2,a3,a4,a5,a6].map(x=>x.id);
  as.committedPoints = 23;
  mk('Passkey sign-in spike', 8, null, null, 'backlog');
  mk('Referral code at signup', 5, null, null, 'backlog');
  mk('Localize onboarding VN', 5, null, null, 'backlog');
  S.activeProjectId = null;
  toast(t('t_demo'));
}

/* ================= drag & drop ================= */
function bindDnD(p){
  app.querySelectorAll('.task[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => { el.classList.add('dragging'); e.dataTransfer.setData('text/plain', el.dataset.task); e.dataTransfer.effectAllowed = 'move'; });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
  });
  app.querySelectorAll('[data-drop]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const x = taskById(p, e.dataTransfer.getData('text/plain'));
      if (x){ setStatus(p, x, col.dataset.drop); render(); }
    });
  });
}

/* ================= event delegation ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action, id = el.dataset.id, p = proj();
  const A = {
    'nav-home': () => { S.activeProjectId = null; render(); },
    'open-project': () => { S.activeProjectId = id; S.tab = 'board'; render(); },
    'tab': () => { S.tab = id; render(); },
    'toggle-coach': () => { S.coach = !S.coach; render(); },
    'set-lang': () => { S.lang = el.dataset.lang; render(); },
    'seed-demo': () => { seedDemo(); render(); },
    'pick-mode': () => {
      const seg = el.closest('.seg');
      seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b===el)));
      el.closest('form').querySelector('[name=mode]').value = el.dataset.m;
    },
    'set-mode': () => {
      if (!p || p.mode === el.dataset.m) return;
      if (el.dataset.m === 'kanban' && activeSprint(p) && !confirm(t('c_kanban'))) return;
      p.mode = el.dataset.m; toast(tf('t_mode', p.mode==='scrum'?'Sprint':'Kanban')); render();
    },
    'open-task': () => { if (p) openTask(p, taskById(p, id)); },
    'close-modal': () => document.getElementById('modal').classList.remove('open'),
    'move-left': () => { moveTask(p, taskById(p,id), -1); render(); },
    'move-right': () => { moveTask(p, taskById(p,id), 1); render(); },
    'pull-task': () => { setStatus(p, taskById(p,id), 'todo'); toast(t('t_pulled')); render(); },
    'create-sprint': () => { createSprint(p); render(); },
    'start-sprint': () => { startSprint(p, p.sprints.find(s=>s.id===id)); render(); },
    'close-sprint': () => { closeSprint(p, p.sprints.find(s=>s.id===id)); render(); },
    'save-task': () => {
      const x = taskById(p, id), g = y => document.getElementById(y);
      x.title = g('mTitle').value.trim() || x.title; x.desc = g('mDesc').value;
      x.type = g('mType').value; x.points = +g('mPts').value || 0; x.blocked = g('mBlocked').checked;
      const st = g('mStatus').value; if (st !== x.status) setStatus(p, x, st);
      const sSel = g('mSprint');
      if (sSel){
        const nsid = sSel.value || null;
        if (nsid !== x.sprintId){
          x.sprintId = nsid;
          const as = activeSprint(p);
          x.addedAfterStart = !!(nsid && as && nsid === as.id);
        }
      }
      document.getElementById('modal').classList.remove('open'); render();
    },
    'delete-task': () => { if (confirm(t('c_delTask'))){ p.tasks = p.tasks.filter(x => x.id !== id); document.getElementById('modal').classList.remove('open'); render(); } },
    'delete-project': () => { if (confirm(tf('c_delProj', p.name))){ S.projects = S.projects.filter(x => x.id !== p.id); S.activeProjectId = null; render(); } },
    'gen-report': () => { document.getElementById('reportOut').value = buildReport(p); },
    'copy-report': () => {
      const v = document.getElementById('reportOut').value || buildReport(p);
      document.getElementById('reportOut').value = v;
      (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast(t('t_copied')), () => { document.getElementById('reportOut').select(); document.execCommand('copy'); toast(t('t_copied')); });
    },
    'download-report': () => {
      const v = document.getElementById('reportOut').value || buildReport(p);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([v], {type:'text/markdown'}));
      a.download = p.key.toLowerCase() + '-status-' + new Date().toISOString().slice(0,10) + '.md';
      a.click(); URL.revokeObjectURL(a.href);
    },
    'export-data': () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], {type:'application/json'}));
      a.download = 'helm-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click(); URL.revokeObjectURL(a.href);
    },
  };
  if (A[act]) A[act]();
});

document.addEventListener('change', e => {
  const p = proj();
  const el = e.target.closest('[data-action-change]');
  if (el && p){
    const x = taskById(p, el.dataset.id);
    const map = {
      'assign-sprint': () => { const nsid = el.value || null; x.sprintId = nsid; const as = activeSprint(p); x.addedAfterStart = !!(nsid && as && nsid === as.id); if (x.addedAfterStart && x.status==='backlog') setStatus(p,x,'todo'); render(); },
      'sprint-goal': () => { p.sprints.find(s=>s.id===el.dataset.id).goal = el.value; save(); },
      'set-name': () => { p.name = el.value.trim() || p.name; save(); },
      'set-sprintlen': () => { p.settings.sprintLen = Math.max(7, +el.value || 14); save(); },
      'set-wipdoing': () => { p.settings.wipDoing = Math.max(1, +el.value || 4); render(); },
      'set-wipreview': () => { p.settings.wipReview = Math.max(1, +el.value || 2); render(); },
    };
    if (map[el.dataset.actionChange]) map[el.dataset.actionChange]();
    return;
  }
  if (e.target.id === 'importFile' && e.target.files[0]){
    const r = new FileReader();
    r.onload = () => { try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data.projects)) throw 0;
      data.lang = data.lang || S.lang;
      S = data; S.activeProjectId = null; toast(t('t_imported')); render();
    } catch(err){ toast(t('t_importFail')); } };
    r.readAsText(e.target.files[0]);
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const p = proj(), fd = new FormData(f);
  if (f.dataset.form === 'create-project'){
    createProject({ name: fd.get('name').trim(), mode: fd.get('mode'),
      sprintLen: +fd.get('sprintLen'), wipDoing: +fd.get('wipDoing') });
    toast(t('t_created')); render();
  }
  if (f.dataset.form === 'new-task' && p){
    const title = fd.get('title').trim(); if (!title) return;
    createTask(p, { title, type: fd.get('type'), points: fd.get('points') });
    toast(t('t_added')); render();
  }
  if (f.dataset.form === 'quick-task' && p){
    const title = fd.get('title').trim(); if (!title) return;
    const x = createTask(p, { title, status:'backlog' });
    setStatus(p, x, 'todo');
    render();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('modal').classList.remove('open'); });

render();
</script>
